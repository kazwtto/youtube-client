[package]
name = "yt-desktop"
version = "0.1.0"
description = "YouTube desktop client written in Rust"
authors = ["YT Desktop contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "yt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable", "protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
discord-rich-presence = "1.1.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "=0.8.1"
webview2-com = "0.39.1"
windows-core = "0.62"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
